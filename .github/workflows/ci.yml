name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Playwright (hermetic)
    # Postgres runs in process and uploads go to disk, so this job needs no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-live:
    name: Playwright (live services)
    # Runs only once the Neon branch and Blob store for testing exist: set the repository variable
    # E2E_LIVE to "true" alongside the E2E_* secrets to switch it on.
    if: github.ref == 'refs/heads/main' && vars.E2E_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL }}
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          ORIKATA_LIVE_BACKEND: "1"
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.E2E_BLOB_READ_WRITE_TOKEN }}
          RATE_LIMIT_SALT: ci-live
          CRON_SECRET: ci-live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 7
